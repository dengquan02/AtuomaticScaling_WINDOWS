## Deep-learning-base Ionogram Automatic Scaler Configuration File (Minimal)

# Data Parameters
Data:
    BasePath: ./dataset/
    TrainListFile: train.lst
    TestListFile: test.lst
    PadHeight: 512
    PadWidth: 512
    ChannelNum: 3
    ClassNum: 3

# Model Parameters
Model:
    Type: FPN
    Backbone: resnet50
    BackboneWeights: None
    PyramidBlockFilters: 256
    Optimizer: Adam
    LearningRate: 0.0001
    Loss: BinaryFocalLoss
    Metric: F_score

Train:
    TotalStep: 20        # 快速演示用小步数
    PrintInterval: 5
    SaveInterval: 10
    PlotInterval: 10
    ImgSaveDir: ./result/minimal/vis_imgs/
    ModelSaveDir: ./result/minimal/models/
    HistLogDir: ./result/minimal/models/

Test:
    TestSave: AllOutput  # 避免走 OnlyMinHMaxF 分支（依赖额外文件）
    ModelPath: ./result/minimal/models/STEP_10.model
    PostProcess: None
    SavePath: ./result/minimal/
    ImgSaveDir: ./result/minimal/test_imgs/
    Threshold: 0.3
    ScaleOnly: True      # 使用 get_scale_only，避免外部 modx 文件依赖

Eval:
    ResultPath: ./result/minimal/MinHMaxF.npy
