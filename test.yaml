## Deep-learning-base Ionogram Automatic Scaler Configuration File

# Data Parameters
Data:
    BasePath: E:/zju/AtuomaticScaling/DIAS/dataset/
    TrainListFile: train_min.lst
    TestListFile: test_min.lst
    # pad input height to 512
    PadHeight: 512
    # pad input width to 512
    PadWidth: 512
    # number of input channels
    ChannelNum: 3 
    # Number of predicted classes
    ClassNum: 3

# Model Parameters
Model:
    Type: FPN
    # Type: Unet

    # Backbone available params: 
    # VGG 'vgg16' 'vgg19'
    # ResNet 'resnet18' 'resnet34' 'resnet50' 'resnet101' 'resnet152'
    # SE-ResNet 'seresnet18' 'seresnet34' 'seresnet50' 'seresnet101' 'seresnet152'
    # ResNeXt 'resnext50' 'resnext101'
    # SE-ResNeXt 'seresnext50' 'seresnext101'
    # SENet154 'senet154'
    # DenseNet 'densenet121' 'densenet169' 'densenet201'
    # Inception 'inceptionv3' 'inceptionresnetv2'
    # MobileNet 'mobilenet' 'mobilenetv2'
    # EfficientNet 'efficientnetb0' 'efficientnetb1' 'efficientnetb2' 'efficientnetb3' 'efficientnetb4' 'efficientnetb5' efficientnetb6' efficientnetb7'
    Backbone: resnet50
    # Backbone: vgg16
    # Backbone: efficientnetb5
    
    # BackboneWeights available params:
    # None imagenet
    BackboneWeights: None
    # Number of pyramid block filters
    PyramidBlockFilters: 256
    # optimizer: Adam RAdam SGD
    Optimizer: Adam
    # Learning rate
    LearningRate: 0.0001
    # Loss function available params:
    # bce (Binary Cross Entropy)
    # dice
    # BinaryFocalLoss
    Loss: BinaryFocalLoss
    # Evalute metric available params:
    # IoU
    # F_score
    Metric: F_score

Train:
    # total training step
    TotalStep: 500
    # print interval
    PrintInterval: 10
    # model save step
    SaveInterval: 20
    # test img plot interval
    PlotInterval: 10
    # img save dirs's
    ImgSaveDir: E:/zju/AtuomaticScaling/DIAS/result/test/vis_imgs/
    # model save dir
    ModelSaveDir: E:/zju/AtuomaticScaling/DIAS/result/test/models/
    HistLogDir: E:/zju/AtuomaticScaling/DIAS/result/test/models/

Test:
    # Options: [OnlyMinHMaxF] [AllOutput]
    TestSave: OnlyMinHMaxF
    # ModelPath: E:/zju/AtuomaticScaling/DIAS/result/FPN_resnet50_Adam/models/STEP_158000.model
    ModelPath: E:/zju/AtuomaticScaling/DIAS/result/FPN_resnet50_Adam/models/STEP_158000_keras3.h5
    PostProcess: None
    SavePath: E:/zju/AtuomaticScaling/DIAS/result/FPN_resnet50_Adam/models/
    # img save dirs's
    ImgSaveDir: E:/zju/AtuomaticScaling/DIAS/result/FPN_resnet50_Adam/test_imgs/
    Threshold: 0.3
    ScaleOnly: True

Eval:
    ResultPath: E:/zju/AtuomaticScaling/DIAS/result/FPN_resnet50_Adam/models/MinHMaxF.npy
    